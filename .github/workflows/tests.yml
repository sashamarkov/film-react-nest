name: Tests 14 sprint

on:
  push:
    branches:
      - "**"
    tags:
      - "**"

env:
  DIR_TESTS: /tmp/tests-back-to-the-film
  REP_TESTS: https://github.com/Yandex-Practicum/tests-back-to-the-film.git

jobs:
  test_backend:
    runs-on: ubuntu-latest
    steps:
      - name: Set up GitHub Actions
        uses: actions/checkout@v4
      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
      - name: Get testing lib
        run: set -eu && git clone --depth 1 $REP_TESTS $DIR_TESTS
      - name: Run tests
        run: bash $DIR_TESTS/bin/backend.sh

  test_endpoints:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: film
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Set up GitHub Actions
        uses: actions/checkout@v4

      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Create .env file
        run: |
          cd backend
          cp .env.example .env
          echo "NODE_ENV=test" >> .env

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Initialize database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d film -f backend/test/prac.init.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d film -f backend/test/prac.films.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d film -f backend/test/prac.shedules.sql

      - name: Get testing lib
        run: set -eu && git clone --depth 1 $REP_TESTS $DIR_TESTS

      - name: Start project
        run: bash $DIR_TESTS/bin/start_project.sh

      - name: Run tests
        run: bash $DIR_TESTS/bin/endpoints.sh
